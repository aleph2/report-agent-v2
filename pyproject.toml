[project]
name = "report-agent-v2"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "deepagents==0.7.19",
    "langchain==1.4.2",
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langchain-openai==1.6.6",
    "pdfplumber==0.11.10",
    "pypdfium2==5.15.2",
    "python-docx==1.2.0",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["reportagent", "reportagent.export", "reportagent.skills"]

[tool.setuptools.package-dir]
"" = "src"
"reportagent.skills" = "skills"

[tool.setuptools.package-data]
"reportagent.skills" = ["plan-report/SKILL.md", "gather-evidence/SKILL.md", "write-section/SKILL.md"]
